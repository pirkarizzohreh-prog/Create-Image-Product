services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pixelforge}
      POSTGRES_USER: ${POSTGRES_USER:-pixelforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixelforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-side port only (for connecting a DB GUI tool); defaults to 5433
      # so it doesn't collide with a Postgres already running on the host.
      # Containers always reach this service at db:5432 regardless.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pixelforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host-side port only, defaults to 6380 to avoid colliding with a
      # Redis already running on the host. Containers reach it at redis:6379.
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Host-side port only (containers always reach it at backend:8000);
      # defaults to 8001 to sidestep the port occasionally leaked/held onto
      # by Docker Desktop itself (com.docker.backend) after repeated
      # restarts. Change BACKEND_HOST_PORT if 8001 is also taken, and keep
      # NEXT_PUBLIC_API_BASE_URL in sync since it's baked into the frontend
      # build.
      - "${BACKEND_HOST_PORT:-8001}:8000"
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media:/app/media
      - u2net_models:/home/appuser/.u2net

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  media:
  u2net_models:
